services:
  astro:
    image: node:24
    container_name: pfadi-astro-dev
    working_dir: /app
    volumes:
      - ..:/app
    command: sleep infinity
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pfadi-astro.rule=Host(`astro.yofukashi.dev`)"
      - "traefik.http.routers.pfadi-astro.entrypoints=websecure"
      - "traefik.http.routers.pfadi-astro.tls.certresolver=cfresolver"
      - "traefik.http.services.pfadi-astro.loadbalancer.server.port=4321"
      - "traefik.docker.network=traefik-net"

networks:
  traefik-net:
    external: true